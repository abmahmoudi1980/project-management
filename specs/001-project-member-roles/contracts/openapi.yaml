openapi: 3.0.3
info:
  title: Project Member Role Assignment API
  version: 1.0.0
  description: API contracts for adding project members from system users with predefined roles.
servers:
  - url: /api
security:
  - cookieAuth: []

paths:
  /projects/{projectId}/members:
    get:
      summary: List project members with assigned predefined roles
      tags: [Project Members]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project members returned as array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Add a user as project member with predefined role (admin only)
      tags: [Project Members]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: member added successfully
        '400':
          description: Validation error (invalid role, ineligible user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: project not found
        '409':
          description: Duplicate project membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: user is already a member of this project

  /projects/{projectId}/members/eligible-users:
    get:
      summary: List eligible system users that can be added to the project
      tags: [Project Members]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Eligible users returned as array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /project-roles:
    get:
      summary: List predefined active project roles
      tags: [Project Roles]
      responses:
        '200':
          description: Active roles returned as array (sorted by hierarchy)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRole'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AddProjectMemberRequest:
      type: object
      required: [user_id, project_role_id]
      properties:
        user_id:
          type: string
          format: uuid
        project_role_id:
          type: string
          format: uuid

    ProjectMemberResponse:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_role_id:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time
        added_by:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
        email:
          type: string
        role_name:
          type: string
          example: manager
        role_display:
          type: string
          example: مدیر

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email

    ProjectRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: manager
        display_name:
          type: string
          example: مدیر
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: invalid project ID
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
